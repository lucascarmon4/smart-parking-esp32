; Smart Parking ESP32 — firmware
;
;   pio run -e wokwi     → compila para o simulador (Wokwi for VS Code)
;   pio run -e esp32 -t upload  → grava no ESP32 físico (precisa de include/secrets.h)

[platformio]
default_envs = wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:wokwi]
build_flags = -DAMBIENTE_WOKWI

[env:esp32]
build_flags = -DAMBIENTE_FISICO
