; Smart Parking ESP32 — firmware
;
;   pio run                → compila (o Wokwi usa o .bin/.elf gerado em .pio/build/esp32/)
;   F1 → Wokwi: Start Simulator  → abre o circuito do diagram.json rodando esse firmware

[env:esp32]
; Versões fixas: Windows e Mac compilam exatamente com o mesmo núcleo e as mesmas libs.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    marcoschwartz/LiquidCrystal_I2C@1.1.4
